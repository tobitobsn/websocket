<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 MPU6050 WebSocket Demo</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .rotation-info { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .value { font-weight: bold; color: #0066cc; }
    .cube-container { perspective: 1000px; width: 300px; height: 300px; margin: 0 auto; }
    .cube { width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
    .face { position: absolute; width: 100%; height: 100%; border: 2px solid black; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .front { background: rgba(255, 0, 0, 0.7); transform: translateZ(150px); }
    .back { background: rgba(0, 255, 0, 0.7); transform: translateZ(-150px) rotateY(180deg); }
    .right { background: rgba(0, 0, 255, 0.7); transform: translateX(150px) rotateY(90deg); }
    .left { background: rgba(255, 255, 0, 0.7); transform: translateX(-150px) rotateY(-90deg); }
    .top { background: rgba(255, 0, 255, 0.7); transform: translateY(-150px) rotateX(90deg); }
    .bottom { background: rgba(0, 255, 255, 0.7); transform: translateY(150px) rotateX(-90deg); }
    .status { margin-top: 20px; padding: 10px; border-radius: 5px; }
    .connected { background-color: rgba(0, 255, 0, 0.2); }
    .disconnected { background-color: rgba(255, 0, 0, 0.2); }
  </style>
</head>
<body>
  <div class="container">
    <h1>ESP32 MPU6050 WebSocket Demo</h1>
    <div class="status disconnected" id="status">Nicht verbunden</div>
    
    <div class="rotation-info">
      <h2>Aktuelle Rotation</h2>
      <p>Roll: <span id="roll" class="value">0</span>°</p>
      <p>Pitch: <span id="pitch" class="value">0</span>°</p>
      <p>Yaw: <span id="yaw" class="value">0</span>°</p>
      <p>Letzte Aktualisierung: <span id="timestamp" class="value">-</span></p>
    </div>
    
    <div class="cube-container">
      <div class="cube" id="cube">
        <div class="face front">Front</div>
        <div class="face back">Back</div>
        <div class="face right">Right</div>
        <div class="face left">Left</div>
        <div class="face top">Top</div>
        <div class="face bottom">Bottom</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const roll = document.getElementById('roll');
      const pitch = document.getElementById('pitch');
      const yaw = document.getElementById('yaw');
      const timestamp = document.getElementById('timestamp');
      const cube = document.getElementById('cube');
      const status = document.getElementById('status');
      
      let socket;
      let reconnectInterval;
      
      function connect() {
        // WebSocket-URL (dynamisch basierend auf aktueller Seite)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        
        socket = new WebSocket(wsUrl);
        
        socket.onopen = function() {
          status.textContent = 'Verbunden';
          status.className = 'status connected';
          clearInterval(reconnectInterval);
        };
        
        socket.onclose = function() {
          status.textContent = 'Verbindung getrennt - versuche neu zu verbinden...';
          status.className = 'status disconnected';
          
          // Automatische Wiederverbindung
          if (!reconnectInterval) {
            reconnectInterval = setInterval(connect, 3000);
          }
        };
        
        socket.onerror = function(error) {
          console.error('WebSocket-Fehler:', error);
        };
        
        socket.onmessage = function(event) {
          try {
            const data = JSON.parse(event.data);
            
            // UI aktualisieren
            roll.textContent = data.roll?.toFixed(2) || data.r?.toFixed(2) || '0';
            pitch.textContent = data.pitch?.toFixed(2) || data.p?.toFixed(2) || '0';
            yaw.textContent = data.yaw?.toFixed(2) || data.y?.toFixed(2) || '0';
            
            // Zeitstempel formatieren
            const date = new Date(data.timestamp);
            timestamp.textContent = `${date.toLocalTimeString()}.${date.getMilliseconds().toString().padStart(3, '0')}`;
            
            // Würfel rotieren
            const rollVal = parseFloat(roll.textContent);
            const pitchVal = parseFloat(pitch.textContent);
            const yawVal = parseFloat(yaw.textContent);
            
            cube.style.transform = `rotateX(${pitchVal}deg) rotateY(${yawVal}deg) rotateZ(${rollVal}deg)`;
          } catch (e) {
            console.error('Fehler beim Parsen der Daten:', e);
          }
        };
      }
      
      // Initial verbinden
      connect();
    });
  </script>
</body>
</html>
